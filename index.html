<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tasks</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #eef1f6;
    --surface: #ffffff;
    --ink: #1b2433;
    --muted: #6b7587;
    --line: #e2e7ef;
    --accent: #2f5bea;
    --accent-ink: #ffffff;
    --done: #12a47a;
    --danger: #d64550;
    --shadow: 0 1px 2px rgba(27,36,51,.06), 0 12px 32px rgba(27,36,51,.08);
    --radius: 18px;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0f131b; --surface: #181e29; --ink: #e8ecf4; --muted: #8b95a8;
      --line: #263042; --accent: #6b8cff; --accent-ink: #0f131b; --done: #36c9a0;
      --danger: #ff7a85; --shadow: 0 1px 2px rgba(0,0,0,.3), 0 12px 32px rgba(0,0,0,.35);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0f131b; --surface: #181e29; --ink: #e8ecf4; --muted: #8b95a8;
    --line: #263042; --accent: #6b8cff; --accent-ink: #0f131b; --done: #36c9a0;
    --danger: #ff7a85; --shadow: 0 1px 2px rgba(0,0,0,.3), 0 12px 32px rgba(0,0,0,.35);
    color-scheme: dark;
  }

  * { box-sizing: border-box; margin: 0; }
  html, body { min-height: 100%; }
  body {
    font-family: "DM Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--ink);
    line-height: 1.5;
    padding: clamp(16px, 5vw, 56px) 16px;
    display: flex;
    justify-content: center;
    align-items: flex-start;
  }
  .app {
    width: 100%;
    max-width: 620px;
    background: var(--surface);
    border-radius: 26px;
    box-shadow: var(--shadow);
    overflow: hidden;
  }

  header { padding: 28px 28px 20px; display: flex; align-items: center; gap: 18px; }
  .head-text { flex: 1; min-width: 0; }
  h1 {
    font-family: "Bricolage Grotesque", "DM Sans", system-ui, sans-serif;
    font-size: 2rem; font-weight: 700; letter-spacing: -0.02em; line-height: 1.1;
  }
  .sub { color: var(--muted); font-size: .95rem; margin-top: 4px; }

  .ring { position: relative; width: 60px; height: 60px; flex: none; }
  .ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
  .ring circle { fill: none; stroke-width: 6; }
  .ring .track { stroke: var(--line); }
  .ring .bar { stroke: var(--done); stroke-linecap: round; transition: stroke-dashoffset .5s ease; }
  .ring span {
    position: absolute; inset: 0; display: grid; place-items: center;
    font-size: .8rem; font-weight: 600;
  }
  .theme-btn {
    flex: none; width: 40px; height: 40px; border-radius: 12px; border: 1px solid var(--line);
    background: transparent; color: var(--muted); cursor: pointer; display: grid; place-items: center;
  }
  .theme-btn:hover { color: var(--ink); border-color: var(--muted); }

  form.add { display: flex; gap: 10px; padding: 0 28px 20px; }
  .add input {
    flex: 1; min-width: 0; font: inherit; color: var(--ink);
    padding: 14px 16px; border-radius: 14px; border: 1.5px solid var(--line);
    background: var(--bg); transition: border-color .15s, background .15s;
  }
  .add input::placeholder { color: var(--muted); }
  .add input:focus { outline: none; border-color: var(--accent); background: var(--surface); }
  .btn-add {
    font: inherit; font-weight: 600; padding: 0 22px; border: 0; border-radius: 14px;
    background: var(--accent); color: var(--accent-ink); cursor: pointer;
    transition: transform .1s, filter .15s;
  }
  .btn-add:hover { filter: brightness(1.08); }
  .btn-add:active { transform: scale(.97); }

  .filters { display: flex; gap: 6px; padding: 0 28px 14px; }
  .filters button {
    font: inherit; font-size: .88rem; font-weight: 500; padding: 7px 14px; border-radius: 999px;
    border: 0; background: transparent; color: var(--muted); cursor: pointer;
  }
  .filters button:hover { color: var(--ink); }
  .filters button[aria-pressed="true"] { background: var(--bg); color: var(--ink); }

  ul { list-style: none; padding: 0; border-top: 1px solid var(--line); }
  li {
    display: flex; align-items: center; gap: 14px; padding: 14px 28px;
    border-bottom: 1px solid var(--line);
  }
  li.enter { animation: pop .25s ease; }
  @keyframes pop { from { opacity: 0; transform: translateY(-6px); } to { opacity: 1; transform: none; } }

  .check {
    appearance: none; -webkit-appearance: none; flex: none; width: 24px; height: 24px; margin: 0;
    border: 2px solid var(--line); border-radius: 50%; cursor: pointer; display: grid; place-items: center;
    background: transparent; transition: background .15s, border-color .15s;
  }
  .check:hover { border-color: var(--done); }
  .check:checked { background: var(--done); border-color: var(--done); }
  .check:checked::after {
    content: ""; width: 6px; height: 11px; border: solid #fff; border-width: 0 2.5px 2.5px 0;
    transform: translateY(-1px) rotate(45deg);
  }
  .check:focus-visible, button:focus-visible, .add input:focus-visible {
    outline: 2px solid var(--accent); outline-offset: 2px;
  }

  .label {
    flex: 1; min-width: 0; word-break: break-word; cursor: text; padding: 2px 0;
    transition: color .2s;
  }
  li.done .label { color: var(--muted); text-decoration: line-through; text-decoration-color: var(--muted); }
  .edit {
    flex: 1; min-width: 0; font: inherit; color: var(--ink); background: var(--bg);
    border: 1.5px solid var(--accent); border-radius: 10px; padding: 6px 10px;
  }
  .edit:focus { outline: none; }

  .icon-btn {
    flex: none; width: 34px; height: 34px; border-radius: 10px; border: 0; background: transparent;
    color: var(--muted); cursor: pointer; display: grid; place-items: center; opacity: 0;
    transition: opacity .15s, background .15s, color .15s;
  }
  li:hover .icon-btn, li:focus-within .icon-btn { opacity: 1; }
  .icon-btn:hover { background: var(--bg); color: var(--danger); }
  @media (hover: none) { .icon-btn { opacity: 1; } }

  .empty { padding: 48px 28px; text-align: center; color: var(--muted); }
  .empty strong { display: block; color: var(--ink); font-size: 1.05rem; margin-bottom: 4px; }

  footer {
    display: flex; justify-content: space-between; align-items: center;
    padding: 16px 28px; color: var(--muted); font-size: .9rem;
  }
  .clear {
    font: inherit; font-size: .9rem; background: none; border: 0; color: var(--muted);
    cursor: pointer; padding: 6px 10px; border-radius: 8px;
  }
  .clear:hover:not(:disabled) { color: var(--danger); background: var(--bg); }
  .clear:disabled { opacity: .4; cursor: default; }

  @media (max-width: 480px) {
    header, form.add, .filters, li, footer { padding-left: 18px; padding-right: 18px; }
    h1 { font-size: 1.6rem; }
    .btn-add { padding: 0 16px; }
  }
  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>
<main class="app">
  <header>
    <div class="head-text">
      <h1 id="greeting">Today</h1>
      <p class="sub" id="date"></p>
    </div>
    <div class="ring" aria-hidden="true">
      <svg viewBox="0 0 60 60">
        <circle class="track" cx="30" cy="30" r="25"/>
        <circle class="bar" id="bar" cx="30" cy="30" r="25" stroke-dasharray="157.08" stroke-dashoffset="157.08"/>
      </svg>
      <span id="pct">0%</span>
    </div>
    <button class="theme-btn" id="theme" type="button" aria-label="Toggle dark mode">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
    </button>
  </header>

  <form class="add" id="form" autocomplete="off">
    <input id="input" type="text" placeholder="Add a task" aria-label="New task" maxlength="200">
    <button class="btn-add" type="submit">Add task</button>
  </form>

  <nav class="filters" aria-label="Filter tasks">
    <button type="button" data-filter="all" aria-pressed="true">All</button>
    <button type="button" data-filter="active" aria-pressed="false">Active</button>
    <button type="button" data-filter="done" aria-pressed="false">Completed</button>
  </nav>

  <ul id="list" aria-live="polite"></ul>

  <footer>
    <span id="count"></span>
    <button class="clear" id="clear" type="button">Clear completed</button>
  </footer>
</main>

<script>
(() => {
  const KEY = "tasks.v1", THEME_KEY = "tasks.theme";
  const $ = id => document.getElementById(id);
  const list = $("list"), form = $("form"), input = $("input");

  let tasks = load();
  let filter = "all";
  let justAdded = null;

  function load() {
    try { return JSON.parse(localStorage.getItem(KEY)) || []; } catch (e) { return []; }
  }
  function save() {
    try { localStorage.setItem(KEY, JSON.stringify(tasks)); } catch (e) {}
  }

  // Header: greeting + date
  const now = new Date(), h = now.getHours();
  $("greeting").textContent = h < 12 ? "Good morning" : h < 18 ? "Good afternoon" : "Good evening";
  $("date").textContent = now.toLocaleDateString(undefined, { weekday: "long", month: "long", day: "numeric" });

  // Theme
  try {
    const t = localStorage.getItem(THEME_KEY);
    if (t) document.documentElement.dataset.theme = t;
  } catch (e) {}
  $("theme").addEventListener("click", () => {
    const root = document.documentElement;
    const isDark = root.dataset.theme === "dark" ||
      (!root.dataset.theme && matchMedia("(prefers-color-scheme: dark)").matches);
    root.dataset.theme = isDark ? "light" : "dark";
    try { localStorage.setItem(THEME_KEY, root.dataset.theme); } catch (e) {}
  });

  function add(text) {
    const t = { id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6), text, done: false };
    tasks.unshift(t);
    justAdded = t.id;
    save(); render();
  }

  function render() {
    const visible = tasks.filter(t =>
      filter === "all" ? true : filter === "active" ? !t.done : t.done);
    list.innerHTML = "";

    if (!visible.length) {
      const msg = tasks.length === 0
        ? ["No tasks yet", "Type above and press Enter to add your first one."]
        : filter === "done"
          ? ["Nothing completed yet", "Finished tasks will show up here."]
          : ["All caught up", "No active tasks left."];
      list.innerHTML = `<li class="empty" style="display:block;border:0"><strong>${msg[0]}</strong>${msg[1]}</li>`;
    }

    visible.forEach(t => {
      const li = document.createElement("li");
      li.dataset.id = t.id;
      if (t.done) li.classList.add("done");
      if (t.id === justAdded) li.classList.add("enter");

      const cb = document.createElement("input");
      cb.type = "checkbox"; cb.className = "check"; cb.checked = t.done;
      cb.setAttribute("aria-label", "Mark complete: " + t.text);
      cb.addEventListener("change", () => { t.done = cb.checked; save(); render(); });

      const label = document.createElement("span");
      label.className = "label"; label.textContent = t.text;
      label.title = "Double-click to edit";
      label.addEventListener("dblclick", () => edit(li, t, label));

      const del = document.createElement("button");
      del.type = "button"; del.className = "icon-btn";
      del.setAttribute("aria-label", "Delete task: " + t.text);
      del.innerHTML = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14M10 11v6M14 11v6"/></svg>';
      del.addEventListener("click", () => {
        tasks = tasks.filter(x => x.id !== t.id); save(); render();
      });

      li.append(cb, label, del);
      list.appendChild(li);
    });
    justAdded = null;

    const total = tasks.length, done = tasks.filter(t => t.done).length, left = total - done;
    $("count").textContent = left === 1 ? "1 task left" : left + " tasks left";
    $("clear").disabled = done === 0;
    const pct = total ? Math.round(done / total * 100) : 0;
    $("pct").textContent = pct + "%";
    $("bar").style.strokeDashoffset = 157.08 * (1 - pct / 100);
    $("clear").hidden = false;
  }

  function edit(li, t, label) {
    const field = document.createElement("input");
    field.className = "edit"; field.value = t.text; field.maxLength = 200;
    field.setAttribute("aria-label", "Edit task");
    label.replaceWith(field);
    field.focus(); field.select();
    let finished = false;
    const finish = commit => {
      if (finished) return; finished = true;
      const v = field.value.trim();
      if (commit && v) { t.text = v; save(); }
      render();
    };
    field.addEventListener("keydown", e => {
      if (e.key === "Enter") finish(true);
      if (e.key === "Escape") finish(false);
    });
    field.addEventListener("blur", () => finish(true));
  }

  form.addEventListener("submit", e => {
    e.preventDefault();
    const v = input.value.trim();
    if (!v) { input.focus(); return; }
    add(v); input.value = ""; input.focus();
  });

  document.querySelectorAll(".filters button").forEach(b =>
    b.addEventListener("click", () => {
      filter = b.dataset.filter;
      document.querySelectorAll(".filters button").forEach(x =>
        x.setAttribute("aria-pressed", String(x === b)));
      render();
    }));

  $("clear").addEventListener("click", () => {
    tasks = tasks.filter(t => !t.done); save(); render();
  });

  render();
})();
</script>
</body>
</html>
